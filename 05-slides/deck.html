<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning Fault Queue</title>
<style>
  :root{
    --ink:#17212b;--muted:#5f6b78;--faint:#97a2ae;--line:#dfe4e9;--band:#f3f5f7;
    --safety:#d0302f;--soon:#e0912b;--routine:#3f8f63;--slate:#33506a;--pale:#c9d2da;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--sans);background:#0e1013;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .shell{container-type:inline-size;width:min(96vw, calc(88vh * 1.7778));}
  .slide{position:relative;background:#fff;color:var(--ink);border-radius:10px;aspect-ratio:16/9;width:100%;overflow:hidden;font-size:1.6cqw;}
  .pad{position:absolute;inset:0;padding:2.1em 2.7em 1.9em;display:flex;flex-direction:column;}
  .eyebrow{font-size:.72em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--safety);margin-bottom:.45em;}
  .headline{font-size:1.55em;font-weight:800;line-height:1.18;letter-spacing:-.01em;max-width:95%;}
  .rule{height:2px;background:var(--ink);margin:.8em 0 .6em;}
  .exlabel{font-size:.7em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:.4em;}
  .canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .canvas svg{width:100%;height:100%;}
  .takeaway{margin-top:.6em;background:var(--band);border-left:3px solid var(--safety);padding:.65em .9em;font-size:.84em;line-height:1.45;color:#25313c;}
  .takeaway b{color:var(--safety);}
  .ftr{display:flex;gap:1em;margin-top:.6em;font-size:.62em;color:var(--faint);}
  .ftr .pg{margin-left:auto;font-weight:700;}
  .cover{justify-content:space-between;}
  .cv-top{font-size:.76em;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--safety);}
  .cv-title{font-size:2.8em;font-weight:800;line-height:1.06;letter-spacing:-.02em;}
  .cv-sub{font-size:1.02em;color:var(--muted);margin-top:.7em;max-width:78%;line-height:1.5;}
  .strip{display:flex;border-top:2px solid var(--ink);padding-top:.9em;}
  .strip>div{flex:1;padding-right:1em;}
  .n{font-size:1.65em;font-weight:800;letter-spacing:-.01em;}
  .l{font-size:.7em;color:var(--muted);margin-top:.15em;text-transform:uppercase;letter-spacing:.06em;line-height:1.35;}
  .red{color:var(--safety);} .grn{color:var(--routine);}
  .cols{display:flex;gap:1.6em;flex:1;min-height:0;}
  .points{flex:1.6;display:flex;flex-direction:column;justify-content:center;gap:.8em;}
  .pt{display:flex;gap:.8em;align-items:flex-start;font-size:.9em;line-height:1.48;color:#25313c;}
  .pt i{flex:none;font-style:normal;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:.85em;display:grid;place-items:center;}
  .pt b{color:var(--ink);}
  .rail{flex:1;background:var(--band);border-radius:8px;padding:1em 1.1em;display:flex;flex-direction:column;justify-content:center;gap:.8em;}
  .rail hr{border:0;height:1px;background:var(--line);margin:0;}
  .ask{font-size:.88em;margin-top:.3em;} .ask b{color:var(--safety);}
  .pipe{display:flex;gap:.7em;width:100%;align-items:stretch;}
  .step{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:.9em .9em .8em;display:flex;flex-direction:column;gap:.35em;position:relative;}
  .step .k{font-size:.66em;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;}
  .step .t{font-size:1.02em;font-weight:800;}
  .step .d{font-size:.74em;color:var(--muted);line-height:1.45;flex:1;}
  .step .tool{font-size:.68em;font-weight:700;color:var(--slate);background:var(--band);border-radius:5px;padding:.3em .5em;align-self:flex-start;}
  .step .big{font-size:1.25em;font-weight:800;color:var(--safety);}
  .arrow{align-self:center;color:var(--faint);font-size:1.3em;}
  .shot{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px -18px rgba(0,0,0,.45);}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;width:100%;}
  .kpi{background:var(--band);border-radius:8px;padding:.9em 1em;}
  .kpi .n{font-size:1.9em;}
  table.cmp{width:100%;border-collapse:collapse;font-size:.78em;}
  table.cmp th{text-align:left;color:var(--muted);font-weight:700;font-size:.85em;text-transform:uppercase;letter-spacing:.04em;padding:.45em .5em;border-bottom:2px solid var(--ink);}
  table.cmp td{padding:.55em .5em;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35;}
  table.cmp tr.hi td{background:#fdeeee;}
  .pill{display:inline-block;font-size:.85em;font-weight:800;padding:.1em .5em;border-radius:99px;color:#fff;}
  .p-safety_urgent{background:var(--safety);} .p-soon{background:var(--soon);} .p-routine{background:var(--routine);}
  .next{display:grid;grid-template-columns:1fr 1fr;gap:1.6em 1.6em;width:100%;}
  .nx{display:flex;gap:.7em;align-items:flex-start;font-size:.86em;line-height:1.45;color:#25313c;}
  .nx i{flex:none;font-style:normal;font-weight:800;color:var(--safety);font-size:1.3em;line-height:1;}
  .nx b{color:var(--ink);}
  .two{display:flex;gap:1.6em;width:100%;align-items:stretch;}
  .two>div{flex:1;}
  .flow{display:flex;flex-direction:column;gap:.45em;}
  .fl{background:var(--band);border-radius:7px;padding:.5em .8em;font-size:.8em;line-height:1.4;color:#25313c;}
  .fl b{color:var(--ink);} .fl.red{background:#fdeeee;}
  .mini{display:flex;gap:.6em;margin-top:.5em;} .mini>div{flex:1;background:var(--band);border-radius:7px;padding:.5em .7em;}
  .mini .n{font-size:1.25em;} .mini .l{font-size:.62em;}
  .nav{display:flex;align-items:center;justify-content:center;gap:1em;margin-top:14px;}
  .nav button{width:40px;height:40px;border-radius:50%;border:1px solid #3a3f47;background:#16181c;color:#fff;font-size:18px;cursor:pointer;}
  .nav button:disabled{opacity:.3;cursor:default;}
  .dots{display:flex;gap:7px;} .dots i{width:8px;height:8px;border-radius:50%;background:#3c4148;cursor:pointer;} .dots i.on{background:var(--safety);}
  body.print{background:#fff;padding:0;display:block;}
  body.print .shell{width:1600px;} body.print .slide{width:1600px;height:900px;border-radius:0;font-size:25.6px;page-break-after:always;break-after:page;}
  body.print .nav{display:none;}
  @page{size:1600px 900px;margin:0;}
</style>
</head>

/* Two strips of 300 ticks: arrival order vs queue page */
function chartStrips(){

/* Horizontal bars: how many of the 60 each approach catches */
function chartCatch(){

  rows.forEach(([lab,v,c],i)=>{ const y=top+i*(h+gap), w=(v/D.hand)*(x1-x0);
    g+=`<text x="${x0-16}" y="${y+38}" text-anchor="end" font-size="19" font-weight="700" fill="#17212b">${lab}</text>`;
    g+=`<rect x="${x0}" y="${y}" width="${x1-x0}" height="${h}" fill="#f3f5f7"/><rect x="${x0}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
    g+=`<text x="${x0+w+12}" y="${y+40}" font-size="24" font-weight="800" fill="#17212b">${v} of ${D.hand}</text>`; });
  return `<svg viewBox="0 0 1000 320">${g}</svg>`;
}

  const cx=days.map((_,i)=>x0+(i+.5)*((x1-x0)/days.length)); let g='';
  [20,40,60].forEach(v=>{const y=y1-(v/vmax)*(y1-y0); g+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#e6eaee"/><text x="${x0-10}" y="${y+5}" text-anchor="end" font-size="15" fill="#97a2ae">${v}</text>`;});
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#17212b" stroke-width="2"/>`;
  days.forEach((d,i)=>{ let acc=0; const dt=new Date(d+'T12:00:00');
    ['safety_urgent','soon','routine'].forEach(t=>{ const v=D.by_day[d][t]||0; if(!v) return; const h=(v/vmax)*(y1-y0); const yb=y1-(acc/vmax)*(y1-y0); acc+=v;
      g+=`<rect x="${cx[i]-bw/2}" y="${yb-h}" width="${bw}" height="${h}" fill="${COL[t]}"/>`;
      if(t==='safety_urgent') g+=`<text x="${cx[i]}" y="${yb-h/2+7}" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${v}</text>`; });
    g+=`<text x="${cx[i]}" y="${y1+26}" text-anchor="middle" font-size="16" fill="#5f6b78">${dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</text>`; });
  let lx=x0; ['safety_urgent','soon','routine'].forEach(t=>{ g+=`<rect x="${lx}" y="${y1+44}" width="15" height="15" fill="${COL[t]}"/><text x="${lx+22}" y="${y1+57}" font-size="15" fill="#33506a">${LABEL[t]}</text>`; lx+=150; });
  return `<svg viewBox="0 0 1000 350">${g}</svg>`;
}

frame({eyebrow:'Urgency rules and tagging',
  headline:`Three tags and four fix paths, and every message is tagged twice: once by the model, once by the rules.`,
  ex:'The urgency rules (left) and how each of the 300 messages got its tag (right)',
  body:`<div class="two"><div><table class="cmp"><tr><th>Tag</th><th>Fix path</th><th>Respond</th><th>Messages</th></tr>
    <tr class="hi"><td>${pill('safety_urgent')}</td><td><b>Tow to service center.</b> Call first, tell them not to drive</td><td>1 hour</td><td><b>${D.paths.tow_to_service_center}</b></td></tr>
    <tr><td>${pill('soon')}</td><td><b>Mobile service.</b> Safe with a workaround</td><td>24 hours</td><td><b>${D.paths.mobile_service}</b></td></tr>
    <tr><td>${pill('routine')}</td><td><b>Service center visit.</b> Physical, not a safety issue</td><td>72 hours</td><td><b>${D.paths.service_center_visit}</b></td></tr>
    <tr><td>${pill('routine')}</td><td><b>Remote fix.</b> Software, fixed over the air</td><td>72 hours</td><td><b>${D.paths.remote_fix}</b></td></tr></table>
    <div class="fl" style="margin-top:.6em"><b>Safety alerts:</b> BRK, ABS, ESP and EPAS codes. <b>Hidden rule:</b> any brake, pedal or steering symptom with no alert is safety urgent. Tone never lowers a tag, and the highest tag wins.</div></div>
   <div class="flow">
    <div class="fl"><b>1. The model tags.</b> A free OpenRouter model reads batches of 10 messages, with a prompt built from the rules.</div>
    <div class="fl"><b>2. Pydantic checks every answer.</b> A valid tag, a valid fix path, and the fix path has to belong to the tag. Bad answers are retried.</div>
    <div class="fl red"><b>3. The rules run as a backstop.</b> They tag every message too, and can only raise a tag, never lower it.</div>
    <div class="mini"><div><div class="n">${D.agree} of ${D.n}</div><div class="l">model and rules agree</div></div><div><div class="n">${D.more_cautious}</div><div class="l">disagreements, all the model being more careful</div></div><div><div class="n">$0</div><div class="l">model cost, free models only</div></div></div>
   </div></div>`,
  so:`The rules are the single source of truth: the prompt, the backstop and the page all read them. The model caught ${D.model_caught} of ${D.hand} hand-checked faults by itself, and the backstop is there for the run where it doesn't.`}),

   <tr class="hi"><td><b>Anti-lock brakes</b></td><td>ABS_w002</td><td>Yes: wheels can lock and the car can slide</td><td>${pill('safety_urgent')}</td></tr>
   <tr class="hi"><td><b>Stability control</b></td><td>ESP_w003</td><td>Yes: the car can lose grip in a turn</td><td>${pill('safety_urgent')}</td></tr>
   <tr class="hi"><td><b>Power steering</b></td><td>EPAS_w202, EPAS_a191</td><td>Yes: the wheel can go heavy mid-turn</td><td>${pill('safety_urgent')}</td></tr>

frame({eyebrow:'Live demo',
  headline:'Two minutes on the live page: a calm note about a soft brake pedal jumps the line, an angry wiper message does not.',
  ex:'Demo script, run on the live Streamlit page',
  body:`<table class="cmp" style="font-size:.86em"><tr><th style="width:4%">#</th><th style="width:30%">Do this</th><th>What the team should see</th><th style="width:9%">Time</th></tr>
   <tr><td><b>1</b></td><td>Open the page</td><td>All ${D.n_safety} safety messages at the top, and the warning: ${D.late} safety cars wait more than a day for a bay</td><td>20 s</td></tr>
   <tr class="hi"><td><b>2</b></td><td>Paste ${c.id}, the Tahoe thank-you note</td><td>${pill(c.tag)} with no alert code and a calm tone. The page quotes "pedal goes further" and the grinding, then books a tow: #${c.rank} of 301, ${c.slot}</td><td>40 s</td></tr>
   <tr><td><b>3</b></td><td>Paste ${w.id}, the angry wiper message</td><td>${pill(w.tag)}, #${w.rank} of 301. Loud, but it lands behind every safety car</td><td>30 s</td></tr>
   <tr><td><b>4</b></td><td>Tick one driver on the call list</td><td>"Still to call" drops by one, and the whole team sees it</td><td>15 s</td></tr>
   <tr><td><b>5</b></td><td>Scroll to the acceptance test</td><td>${D.acc_match} of ${D.acc_n} test messages get the right safety call</td><td>15 s</td></tr></table>`,
  so:'If the live page fails, the page and key insight slides show the same screens. The demo proves the point the numbers make: the problem in the car decides the order.'}),

frame({eyebrow:'Results',
  headline:`Every hand-checked safety fault is caught, and all ${D.n_safety} safety messages sit above everything else.`,
  ex:'Results on the overnight batch and the acceptance test',
  body:`<div class="kpis">
   <div class="kpi"><div class="n red">${D.rules_caught} of ${D.hand}</div><div class="l">Hand-checked safety faults tagged safety urgent</div></div>
   <div class="kpi"><div class="n">${D.model_caught} of ${D.hand}</div><div class="l">Caught by the AI model before the rules backstop</div></div>
   <div class="kpi"><div class="n">${D.acc_match} of ${D.acc_n}</div><div class="l">Acceptance test messages with the right safety call</div></div>
   <div class="kpi"><div class="n grn">#1 to #${D.page_last_safety_rank}</div><div class="l">Queue positions of the ${D.n_safety} safety messages</div></div>
   <div class="kpi"><div class="n grn">${D.booked} of ${D.n}</div><div class="l">Messages booked into a slot this week</div></div>
   <div class="kpi"><div class="n">${D.checks_passed} of ${D.checks}</div><div class="l">Schedule checks passed, incl. safety always in a bay</div></div>
  </div>`,
  so:`The hand-checked set has only confirmed safety faults, so this shows recall, not precision. Some of the ${D.n_safety} may be over-flagged, and that is the safe way to be wrong: an extra call costs minutes.`}),

frame({eyebrow:'Key insight',
  headline:'The tag comes from the fault, not the tone: a calm brake note goes first, angry wiper and screen complaints wait.',

frame({eyebrow:'Service schedule and safety check',
  headline:`Every message is booked by rule, and all ${D.hand} hand-checked safety faults land in a bay by ${new Date(D.hand_last_day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'})}.`,
  ex:'Booking rules (left) and the safety check against the hand-checked set (right)',
  body:`<div class="two"><div class="flow">
    <div class="fl"><b>The fix path picks the slot type.</b> Tow and visit get a bay, mobile service gets a van, remote fix gets the remote desk.</div>
    <div class="fl red"><b>Safety first.</b> Safety cars take the earliest bays, in order: off the road, worst symptoms, oldest. The top ${D.by_day[Object.keys(D.by_day)[0]].safety_urgent} get Monday. No soon or routine message gets a bay while a safety car waits, so a wiper question can't hold up a brake fault.</div>
    <div class="fl"><b>The model books, the tool enforces.</b> The model calls <i>book_slot</i>, which rejects any slot that breaks a rule and says why. ${D.booked_model} booked by the model, ${D.booked_fallback} routine ones by code after 4 tries.</div>
    <div class="fl"><b>Overflow only when full.</b> ${D.callbacks} remote fixes moved to a phone callback. Safety tows never overflow.</div>
   </div><div><table class="cmp"><tr><th>Check</th><th>Result</th></tr>
    <tr><td>Messages booked this week / schedule checks passed</td><td><b>${D.booked} of ${D.n}</b> / <b>${D.checks_passed} of ${D.checks}</b></td></tr>
    <tr class="hi"><td><b>Hand-checked safety faults tagged safety urgent</b></td><td><b>${D.rules_caught} of ${D.hand}</b>, no misses</td></tr>
    <tr><td>With no dashboard alert</td><td>${D.none_caught} of ${D.none_code}</td></tr>
    <tr><td>Written in a calm, polite tone</td><td>${D.calm_caught} of ${D.calm_n}</td></tr>
    <tr><td>Booked in a service bay</td><td>${D.hand_in_bay} of ${D.hand}</td></tr>
    <tr><td>Safety messages nobody hand-checked</td><td>${D.unchecked}, sent to the reviewer next</td></tr></table></div></div>`,
  so:`The check measures recall only, because the hand-checked set has no confirmed safe messages. It proves no known brake fault is missed or left without a bay. It can't prove the other safety tags are all real, which is why the next batch goes to a reviewer.`}),

frame({eyebrow:'Data quality and missed faults',
  headline:`No known safety fault is missed, and every data problem found is flagged instead of hidden.`,
  ex:'What the data looked like, and what the system does about each problem',
  body:`<div class="two"><div><table class="cmp"><tr><th>Data quality finding</th><th>What happens</th></tr>
    <tr><td><b>${D.n} of ${D.n}</b> rows pass validation</td><td>A bad row is reported, never tagged</td></tr>
    <tr><td><b>${D.none_all} of ${D.n}</b> messages have no alert code</td><td>The words are read, not just the code</td></tr>
    <tr><td><b>${D.cut_off}</b> messages are cut off mid-sentence</td><td>Tagged at least soon, with a call back. ${D.cut_off_safety} already show a safety fault</td></tr>
    <tr><td><b>${D.vin_conflicts}</b> VIN endings appear on more than one car</td><td>Listed in the report so nobody books the wrong car</td></tr>
    <tr class="hi"><td><b>All ${D.hand}</b> hand-checked rows are safety faults</td><td>Recall can be measured, false alarms can't yet</td></tr></table></div>
   <div class="flow">
    <div class="fl red"><b>Missed safety faults: 0 of ${D.hand}.</b> ${D.none_caught} of ${D.none_code} with no alert and ${D.calm_caught} of ${D.calm_n} written calmly are all caught.</div>
    <div class="fl"><b>Three nets against a miss.</b> The hidden rule (any brake, pedal or steering symptom), the rules backstop behind the model, and tests that fail if a brake message slips down.</div>
    <div class="fl"><b>Where a miss could still come from.</b> Wording nobody has seen, with no alert code, that the model also reads as harmless. That's why any brake or pedal mention counts, and why over-flagging is allowed.</div>
    <div class="fl"><b>What's still unknown.</b> How many of the ${D.unchecked} unchecked safety tags are false alarms. They go to the reviewer next.</div>
   </div></div>`,
  so:'One missed brake fault could hurt someone, so the system is built to be wrong in the safe direction: it would rather call a driver who was fine than skip one who wasn’t.'}),

frame({eyebrow:'The constraint',
  headline:`Monday has ${D.by_day[Object.keys(D.by_day)[0]].safety_urgent} bays for ${D.n_safety} safety cars, so ${D.late} of them wait more than a day.`,
  ex:'Bookings by day and tag, week of 16 November',
  body:chartDays(),
  so:'Every safety driver gets a call on Monday and is told not to drive, but a car parked until Wednesday is a driver without a car. The worst cases go first, and no lower tag ever takes a bay while a safety car waits.'}),

frame({eyebrow:'Next steps',
  headline:'Four next steps, starting with bay capacity.',
  body:`<div class="next">
   <div class="nx"><i>1</i><div><b>Add early-week bay capacity.</b> ${D.late} safety cars wait more than a day. Extra Monday or Tuesday bays, or a mobile technician checking brake complaints first, cut that wait directly.</div></div>
   <div class="nx"><i>2</i><div><b>Measure precision.</b> Send the ${D.n_safety - D.hand} safety messages nobody hand-checked to a reviewer, so we know how many are over-flagged.</div></div>
   <div class="nx"><i>3</i><div><b>Fix one prompt line.</b> The model once read "no alert code" as an unknown code. One sentence fixes it, then rerun.</div></div>
   <div class="nx"><i>4</i><div><b>Let advisors move a car between tiers</b> after the Monday call, since a two-minute conversation beats a keyword score.</div></div>
  </div>`,
  so:'Brake warnings no longer wait in line. The page shows the service team why: the problem in the car decides the order, and the tests keep it that way.'}),
];

const print=location.search.includes('print');
const shell=document.getElementById('shell');
if(print){ document.body.classList.add('print'); shell.innerHTML=slides.map(h=>`<div class="slide">${h}</div>`).join(''); }
else{
  const slide=document.getElementById('slide'),dots=document.getElementById('dots'),prev=document.getElementById('prev'),next=document.getElementById('next'); let i=0;
  function render(){ slide.innerHTML=slides[i]; dots.innerHTML=slides.map((_,k)=>`<i class="${k===i?'on':''}" data-k="${k}"></i>`).join('');
    dots.querySelectorAll('i').forEach(d=>d.onclick=()=>{i=+d.dataset.k;render();}); prev.disabled=i===0; next.disabled=i===slides.length-1; }
  prev.onclick=()=>{if(i>0){i--;render();}}; next.onclick=()=>{if(i<slides.length-1){i++;render();}};
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.onclick(); if(e.key==='ArrowLeft')prev.onclick();});
  render();
}
</script>
</body>
